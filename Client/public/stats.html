<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Parteria Stats</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="/favicon.ico" rel="icon" sizes="any">
<link href="/logo.png" rel="icon" type="image/png">
<link href="/apple-touch-icon.png" rel="apple-touch-icon">
<style>
@font-face {
    font-family: "Ubuntu";
    font-weight: 700;
    src: url("/fonts/Ubuntu-Bold.ttf") format("truetype");
}
:root {
    --grass: #1ea761;
    --grass-dark: #167a47;
    --ink: #222;
    --panel: rgba(255, 255, 255, 0.16);
    --panel-line: rgba(255, 255, 255, 0.28);
    --gold: #ffd54a;
    --silver: #d7dee3;
    --bronze: #e39a5f;
    /* the rarity colours of the game */
    --common: #7eef6d; --unusual: #ffe65d; --rare: #4d52e3; --epic: #861fde;
    --legendary: #de1f1f; --mythic: #1fdbde; --exotic: #ff2b75; --ancient: #2bffa3;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100%; }
body {
    font-family: "Ubuntu", system-ui, sans-serif;
    font-weight: 700;
    color: #fff;
    background:
        radial-gradient(1200px 700px at 15% -10%, #3cc97d 0%, transparent 60%),
        radial-gradient(900px 600px at 100% 10%, #14803f 0%, transparent 55%),
        var(--grass);
    background-attachment: fixed;
    overflow-x: hidden;
}
/* the outlined text of the game */
.outline { text-shadow: -2px 0 var(--ink), 2px 0 var(--ink), 0 -2px var(--ink), 0 2px var(--ink),
    -1.5px -1.5px var(--ink), 1.5px -1.5px var(--ink), -1.5px 1.5px var(--ink), 1.5px 1.5px var(--ink); }

/* drifting petals behind everything */
#petals { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
#petals i {
    position: absolute; bottom: -40px; border-radius: 50%; background: rgba(255, 255, 255, 0.55);
    animation: drift linear infinite;
}
@keyframes drift {
    from { transform: translate3d(0, 0, 0); opacity: 0; }
    10% { opacity: 1; }
    to { transform: translate3d(var(--dx), -115vh, 0); opacity: 0; }
}

main { position: relative; z-index: 1; max-width: 1500px; margin: 0 auto; padding: 22px 18px 60px; }

header { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 22px; margin-bottom: 18px; }
header .brand { display: flex; align-items: center; gap: 14px; }
header img { width: 58px; height: 58px; filter: drop-shadow(0 3px 0 rgba(0, 0, 0, 0.3)); }
header h1 { font-size: 44px; line-height: 1; letter-spacing: 0.5px; }
header h1 small { display: block; font-size: 16px; opacity: 0.9; margin-top: 4px; letter-spacing: 1px; text-transform: uppercase; }
header nav { margin-left: auto; display: flex; gap: 10px; flex-wrap: wrap; }
.btn {
    font: inherit; color: #fff; cursor: pointer; text-decoration: none;
    padding: 9px 18px; border-radius: 10px; border: 3px solid var(--ink);
    background: #3fbf6f; box-shadow: 0 4px 0 rgba(0, 0, 0, 0.35);
    transition: transform 0.08s, filter 0.15s;
}
.btn:hover { filter: brightness(1.12); }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0, 0, 0, 0.35); }
.btn.alt { background: #4a8cf0; }
.btn.warn { background: #d4b30c; }
.btn[disabled] { filter: grayscale(0.7) brightness(0.8); cursor: not-allowed; }


#strip { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 10px 16px; margin-bottom: 20px;
    background: var(--panel); border: 2px solid var(--panel-line); border-radius: 14px; backdrop-filter: blur(4px); }
#q { flex: 1 1 260px; min-width: 0; font: inherit; font-size: 18px; color: #fff; padding: 9px 14px; border-radius: 10px; border: 3px solid var(--ink);
    background: rgba(0, 0, 0, 0.3); outline: none; }
#q::placeholder { color: rgba(255, 255, 255, 0.6); }
#results { list-style: none; margin: -8px 0 18px; display: none; background: rgba(8, 60, 32, 0.7); border: 2px solid var(--panel-line); border-radius: 14px; overflow: hidden; }
#results li a { display: block; padding: 9px 16px; color: #fff; text-decoration: none; }
#results li a:hover { background: rgba(255, 255, 255, 0.18); }
#results li.none { padding: 9px 16px; opacity: 0.7; font-weight: 400; }
.sheet { display: grid; gap: 22px; }
.panel { background: var(--panel); border: 2px solid var(--panel-line); border-radius: 22px; padding: 18px; backdrop-filter: blur(4px); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18); }
.panel > h2 { font-size: 26px; margin-bottom: 12px; }
.who { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 22px; }
.who h2 { font-size: 40px; line-height: 1.05; overflow-wrap: anywhere; }
.who small { display: block; font-size: 14px; font-weight: 400; opacity: 0.85; margin-top: 4px; }
.lvl { min-width: 84px; text-align: center; padding: 8px 14px; border-radius: 14px; border: 3px solid var(--ink); background: var(--common); color: var(--ink); font-size: 26px; line-height: 1; }
.lvl small { display: block; font-size: 11px; opacity: 0.8; font-weight: 700; letter-spacing: 1px; }
.who .btn { margin-left: auto; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.tile { --accent: var(--common); background: rgba(8, 60, 32, 0.42); border: 2px solid rgba(255, 255, 255, 0.2); border-radius: 14px; padding: 10px 12px; position: relative; overflow: hidden; }
.tile::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--accent); }
.tile.big { grid-column: span 2; }
.tile .k { font-size: 13px; opacity: 0.85; text-transform: uppercase; letter-spacing: 0.5px; }
.tile .v { font-size: 28px; font-variant-numeric: tabular-nums; }
.tile .r { font-size: 12px; font-weight: 400; opacity: 0.8; }
.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.mode { background: rgba(8, 60, 32, 0.42); border: 2px solid rgba(255, 255, 255, 0.2); border-radius: 16px; padding: 12px; }
.mode h3 { font-size: 20px; margin-bottom: 6px; }
.mode .line { display: flex; justify-content: space-between; font-size: 15px; padding: 2px 0; }
.mode .pct { height: 12px; border-radius: 8px; background: rgba(0, 0, 0, 0.3); border: 2px solid var(--ink); overflow: hidden; margin-top: 8px; }
.mode .pct b { display: block; height: 100%; background: linear-gradient(90deg, var(--exotic), var(--unusual), var(--ancient)); }
.mode .note { font-size: 12px; font-weight: 400; opacity: 0.75; margin-top: 6px; }
.slots { display: flex; flex-wrap: wrap; gap: 10px; }
.slot { --c: var(--common); width: 92px; padding: 8px 4px 6px; text-align: center; border-radius: 14px; border: 3px solid var(--ink); background: var(--c); color: var(--ink); }
.slot .dotp { width: 56px; height: 56px; margin: 0 auto 4px; border-radius: 12px; background: rgba(255, 255, 255, 0.25); border: 3px solid var(--ink); overflow: hidden; }
.slot .dotp img { width: 100%; height: 100%; display: block; }
.slot .nm { font-size: 13px; line-height: 1.1; overflow-wrap: anywhere; }
.slot .rar { font-size: 10px; opacity: 0.8; }
.slot.empty { background: rgba(0, 0, 0, 0.25); color: #fff; border-style: dashed; opacity: 0.6; }
.gap { height: 4px; }
#error { display: none; margin-bottom: 16px; padding: 10px 16px; border-radius: 12px; background: rgba(222, 31, 31, 0.55); border: 2px solid var(--ink); }
.foot { margin-top: 26px; text-align: center; font-size: 13px; opacity: 0.8; font-weight: 400; }
</style>
</head>
<body>
<div id="petals"></div>
<main>
    <header>
        <div class="brand">
            <img src="/logo.png" alt="">
            <h1 class="outline">Stats<small class="outline" id="sub">Parteria</small></h1>
        </div>
        <nav>
            <a class="btn" href="/">Play Parteria</a>
            <a class="btn" href="/status">My stats</a>
            <a class="btn alt" href="/leaderboard">Leaderboards</a>
            <a class="btn warn" href="/gardn/stats">Gardn stats</a>
        </nav>
    </header>

    <section id="strip">
        <input id="q" type="search" placeholder="Find a player by username" autocomplete="off" maxlength="40" spellcheck="false">
        <button class="btn" id="go" type="button">Search</button>
    </section>
    <ul id="results"></ul>
    <div id="error"></div>

    <div class="sheet" id="sheet"></div>
    <p class="foot" id="foot">Only public numbers are shown. Wins in the minigames count when the match was started with the PIN.</p>
</main>

<script>
"use strict";
// the names of Parteria's petals, by id (scripts/gen-petal-table.py)
/*RRPETALS-BEGIN*/
const RR_PETALS = ["Secret", "Petal", "Pellet", "Fossil", "Stinger", "Berry", "Shell", "Peas", "Leaf", "Egg", "Magnet", "Uranium", "Feather", "Azalea", "Bone", "Web", "Seed", "Gravel", "Club", "Crest", "Droplet", "Beak", "Lightning", "Third Eye", "Nest", "Fireball", "Meat", "Bubble", "Meteor", "Mandible", "Wax", "Sand", "Mint", "Bee Egg", "Beehive Post", "Nazar"];   // the index is the petal id
/*RRPETALS-END*/
const RARITIES = ["Common", "Unusual", "Rare", "Epic", "Legendary", "Mythic", "Exotic", "Ancient"];
const RARITY_VAR = ["common", "unusual", "rare", "epic", "legendary", "mythic", "exotic", "ancient"];
const MODES = { ctf: "Capture the flag", tdm: "Team deathmatch", has: "Hide and seek" };
const LOOK = { rr_level: "common", rr_pvp_kills: "legendary", rr_pvp_best: "exotic", rr_ancient_attempts: "mythic", rr_ancients: "ancient", rr_ancient_kills: "epic", rr_kills: "unusual" };
const UUID = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;

// Nothing here limits the number of asks: the master does (60 a minute for an
// address, 30 for searches) and answers 429.
const qs = new URLSearchParams(location.search);
function apiBase() {
    if (qs.get("api")) return qs.get("api").replace(/\/+$/, "");
    if (/^game\./.test(location.hostname)) return location.protocol + "//" + location.host.replace(/^game\./, "api-game.");
    return location.protocol + "//" + location.hostname + ":55554";
}
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = (n) => Math.round(n).toLocaleString("en-US");
function fmt(n) {
    n = Math.round(n);
    if (n < 1e6) return n.toLocaleString("en-US");
    for (const [v, u] of [[1e12, "T"], [1e9, "B"], [1e6, "M"]]) if (n >= v) return (n / v).toFixed(n >= v * 100 ? 0 : 1).replace(/\.0$/, "") + u;
    return String(n);
}
const me = (() => {
    try { const u = localStorage.getItem("uuid") || localStorage.getItem("rivet_account_uuid") || ""; return UUID.test(u) ? u : ""; }
    catch (e) { return ""; }
})();

// /status is the page of the logged in player, /stats?uuid=... anybody's
const isStatus = location.pathname.replace(/\/+$/, "") === "/status";
let target = qs.get("uuid") || "";
if (isStatus) target = me;
let targetName = isStatus ? "" : (qs.get("name") || "");

let busyUntil = 0;
async function api(path) {
    if (Date.now() < busyUntil) throw new Error("Too many requests from this address. Try again in a minute.");
    const res = await fetch(apiBase() + path, { headers: { accept: "application/json" }, cache: "no-store" });
    if (res.status === 429) { busyUntil = Date.now() + 60000; throw new Error("Too many requests from this address. Try again in a minute."); }
    const body = await res.json().catch(() => ({}));
    if (res.status === 404) throw new Error("No such player.");
    if (!res.ok || !body.ok) throw new Error("The server answered " + res.status + ".");
    return body;
}
function fail(message) { $("error").textContent = message; $("error").style.display = "block"; }

function slotHtml(entry) {
    if (!Array.isArray(entry) || !entry[0]) return '<div class="slot empty"><div class="dotp"></div><div class="nm">empty</div></div>';
    const id = entry[0], r = Math.max(0, Math.min(7, entry[1] | 0));
    // the picture is the petal as the game draws it at this rarity: the build saves one for
    // every petal and rarity (icons/rysteria/<id>-<rarity>.png, scripts/gen-icons.mjs)
    return '<div class="slot" style="--c:var(--' + RARITY_VAR[r] + ')"><div class="dotp"><img src="/icons/rysteria/' + id + "-" + r +
        '.png" alt="" loading="lazy" onerror="this.style.display=\'none\'"></div><div class="nm">' + esc(RR_PETALS[id] || "Petal " + id) +
        '</div><div class="rar">' + RARITIES[r] + "</div></div>";
}

function render(p) {
    document.title = p.name + " - Parteria Stats";
    const link = location.origin + "/stats?uuid=" + p.uuid;
    let h = '<section class="panel who"><div><h2 class="outline">' + esc(p.name) + "</h2><small>Joined " +
        (p.created ? new Date(p.created * 1000).toLocaleDateString() : "?") + "</small></div>" +
        '<div class="lvl">' + num(p.level) + "<small>LEVEL</small></div>" +
        '<button class="btn alt" id="share" type="button">Copy link</button></section>';

    h += '<section class="panel"><h2 class="outline">Stats</h2><div class="tiles">';
    h += '<div class="tile big" style="--accent:var(--exotic)"><div class="k">Highest PvP score</div><div class="v" title="' + num(p.pvp_best) + '">' + fmt(p.pvp_best) + "</div></div>";
    for (const s of p.stats) {
        if (s.id === "rr_pvp_best" || s.id === "rr_level") continue;
        h += '<div class="tile" style="--accent:var(--' + (LOOK[s.id] || "common") + ')"><div class="k">' + esc(s.title) + '</div><div class="v" title="' + num(s.score) +
            '">' + fmt(s.score) + '</div><div class="r">' + (s.rank ? "#" + num(s.rank) + " on the leaderboard" : "not ranked") + "</div></div>";
    }
    h += "</div></section>";

    h += '<section class="panel"><h2 class="outline">Minigames</h2><div class="modes">';
    for (const m of Object.keys(MODES)) {
        const g = p.minigames[m] || { wins: 0, played: 0, lost: 0, win_percent: 0 };
        h += '<div class="mode"><h3>' + MODES[m] + '</h3><div class="line"><span>Won</span><span>' + num(g.wins) + '</span></div><div class="line"><span>Lost</span><span>' +
            num(g.lost) + '</span></div><div class="line"><span>Played</span><span>' + num(g.played) + '</span></div><div class="line"><span>Win rate</span><span>' +
            g.win_percent + '%</span></div><div class="pct"><b style="width:' + Math.min(100, g.win_percent) + '%"></b></div>' +
            (g.rank ? '<div class="note">#' + num(g.rank) + " in wins</div>" : "") + "</div>";
    }
    h += "</div></section>";

    const slots = Object.keys(p.loadout || {}).sort((a, b) => a - b);
    h += '<section class="panel"><h2 class="outline">Loadout</h2>';
    h += slots.length ? '<div class="slots">' + slots.map((k) => slotHtml(p.loadout[k])).join("") + "</div>" : "<p>The loadout is empty.</p>";
    h += "</section>";
    $("sheet").innerHTML = h;
    $("share").addEventListener("click", async () => {
        try { await navigator.clipboard.writeText(link); $("share").textContent = "Copied!"; }
        catch (e) { prompt("Copy this link", link); }
        setTimeout(() => ($("share").textContent = "Copy link"), 1800);
    });
}

async function load() {
    $("error").style.display = "none";
    try {
        if (!target && !targetName) {
            $("sheet").innerHTML = '<section class="panel"><h2 class="outline">' + (isStatus ? "Log in to see your stats" : "Find a player") + "</h2><p>" +
                (isStatus ? "Open the game page and log in, then come back here. Your page can be shared: it has your link in it."
                          : "Type a username above, or open a link that ends in ?uuid=...") + "</p></section>";
            return;
        }
        const p = await api("/profile?" + (target ? "uuid=" + encodeURIComponent(target) : "name=" + encodeURIComponent(targetName)));
        target = p.uuid;
        // a link that names the player by uuid can be shared as it is
        if (!isStatus && qs.get("uuid") !== p.uuid) history.replaceState(null, "", "/stats?uuid=" + p.uuid);
        render(p);
    } catch (e) { $("sheet").innerHTML = ""; fail(e.message || String(e)); }
}

// ------------------------------------------------------------- search
let timer = 0, seq = 0;
async function search(immediate) {
    const q = $("q").value.trim();
    const list = $("results");
    if (q.length < 1) { list.style.display = "none"; return; }
    const mine = ++seq;
    try {
        const r = await api("/profile/search?q=" + encodeURIComponent(q));
        if (mine !== seq) return;
        list.innerHTML = r.results.length
            ? r.results.map((x) => '<li><a href="/stats?uuid=' + x.uuid + '">' + esc(x.name) + "</a></li>").join("")
            : '<li class="none">Nobody has a name that starts like that.</li>';
        list.style.display = "block";
        if (immediate && r.results.length === 1) location.href = "/stats?uuid=" + r.results[0].uuid;
    } catch (e) { list.style.display = "none"; fail(e.message || String(e)); }
}
$("q").addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(() => search(false), 450); });
$("q").addEventListener("keydown", (e) => { if (e.key === "Enter") { clearTimeout(timer); search(true); } });
$("go").addEventListener("click", () => search(true));

(() => {
    const box = $("petals");
    for (let i = 0; i < 26; ++i) {
        const p = document.createElement("i");
        const size = 5 + Math.random() * 14;
        p.style.cssText = "left:" + Math.random() * 100 + "%;width:" + size + "px;height:" + size + "px;--dx:" + (Math.random() * 160 - 80) +
            "px;animation-duration:" + (16 + Math.random() * 22) + "s;animation-delay:-" + Math.random() * 30 + "s;opacity:.0";
        box.appendChild(p);
    }
})();
load();
</script>
</body>
</html>
